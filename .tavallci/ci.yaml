version: 2

source:
  repository: TavallStudios/tavall-test-suite-tools
  provider: github

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

modules:
  - gradle-plugin
  - modules/core
  - modules/patterns
  - modules/testing
  - modules/di
  - modules/registry
  - modules/cache
  - modules/database
  - modules/runtime
  - modules/web
  - modules/cli

dependencies:
  - kind: source
    identity: TavallStudios/tavall-cache
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-custom-enum-java
    role: SHARED_DEP
    selector: required-source
    substitutions: "org.tavall:tavall-custom-enum-java=:"
  - kind: source
    identity: TavallStudios/tavall-database
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-di
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-logging
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-registry
    role: SHARED_DEP
    selector: required-source

primaryPlugins:
  - pluginId: org.tavall.architecture-tests
    pluginVersion: 1.1.0
    versionProperty: tavallArchitectureVersion
    pluginProjectPath: :gradle-plugin
    substitutions: "org.tavall:tavall-architecture-core=:modules:core"

requiredChecks:
  - quality

checks:
  quality:
    executor: gradle
    tasks:
      - build
