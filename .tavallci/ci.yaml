version: 2

source:
  repository: TavallStudios/tavall-test-suite-tools
  provider: github

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

modules:
  - gradle-plugin
  - modules/core
  - modules/patterns
  - modules/di
  - modules/registry
  - modules/cache
  - modules/database
  - modules/runtime
  - modules/web

dependencies:
  - kind: source
    identity: TavallStudios/tavall-cache
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-database
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-di
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-logging
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-registry
    role: SHARED_DEP
    selector: required-source

requiredChecks:
  - quality

checks:
  quality:
    executor: gradle
    tasks:
      - build
