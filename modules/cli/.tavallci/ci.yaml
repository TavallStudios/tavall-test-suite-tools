version: 2

source:
  repository: TavallStudios/tavall-test-suite-tools

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

dependencies:
  - kind: source
    identity: TavallStudios/tavall-cli
    role: SHARED_DEP
    selector: required-source
    substitutions: "org.tavall:tavall-cli=:,org.tavall:tavall-cli-api=:tavall-cli-api"

artifacts:
  - name: tavall-architecture-cli
    path: build/libs/tavall-architecture-cli-1.1.0.jar
    channel: RELEASE

requiredChecks:
  - quality

checks:
  quality:
    executor: gradle
    tasks:
      - check
