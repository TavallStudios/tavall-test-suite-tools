version: 2

source:
  repository: TavallStudios/tavall-test-suite-tools

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

artifacts:
  - name: tavall-architecture-registry
    path: build/libs/tavall-architecture-registry-1.1.0.jar

requiredChecks:
  - quality

checks:
  quality:
    executor: gradle
    tasks:
      - check
